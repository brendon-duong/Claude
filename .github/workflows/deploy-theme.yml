name: Deploy Nitidus to Shopify

# Overlays the Nitidus files onto a Shopify theme and pushes the result.
#
# The overlay is done against a fresh pull rather than pushed on its own,
# because shopify/ is a partial theme — it has no layout, config or locales —
# and the CLI pushes a theme directory, not a fragment. Pulling first also
# means the layout edit happens against whatever the theme actually contains
# today rather than against an assumption.

on:
  push:
    branches: [claude/access-issue-jb081h]
    paths: ['shopify/**', '.github/workflows/deploy-theme.yml', 'scripts/**']
  workflow_dispatch:
    inputs:
      theme_id:
        description: Theme to deploy to (blank uses the THEME_ID variable)
        required: false
      allow_live:
        description: Permit deploying to the PUBLISHED theme
        type: boolean
        default: false

concurrency:
  group: shopify-theme-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_STORE }}
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      THEME_ID: ${{ github.event.inputs.theme_id || vars.SHOPIFY_THEME_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @shopify/cli imports enableCompileCache from
          # node:module, which does not exist before 22 and makes the CLI
          # exit before it prints anything.
          node-version: '22'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Check configuration
        run: |
          set -euo pipefail
          missing=0
          [ -n "${SHOPIFY_FLAG_STORE:-}" ]     || { echo "::error::Repository variable SHOPIFY_STORE is not set (e.g. nitidus.store)"; missing=1; }
          [ -n "${THEME_ID:-}" ]               || { echo "::error::Repository variable SHOPIFY_THEME_ID is not set"; missing=1; }
          [ -n "${SHOPIFY_CLI_THEME_TOKEN:-}" ] || { echo "::error::Repository secret SHOPIFY_CLI_THEME_TOKEN is not set (Theme Access app)"; missing=1; }
          [ "$missing" = "0" ] || exit 1
          echo "store=$SHOPIFY_FLAG_STORE theme=$THEME_ID token=present"

      - name: Check the target is not the live theme
        if: ${{ github.event.inputs.allow_live != 'true' }}
        run: |
          set -euo pipefail
          # Capture separately so a CLI failure is reported as a CLI failure
          # rather than surfacing as a JSON parse error further down.
          if ! shopify theme list --json > themes.json 2> cli.log; then
            echo "::error::shopify theme list failed"
            cat cli.log
            exit 1
          fi
          role=$(THEME_ID="$THEME_ID" python3 - themes.json <<'PY'
          import json, os, sys
          try:
              themes = json.load(open(sys.argv[1]))
          except Exception as e:
              print("unparseable", file=sys.stderr); raise SystemExit("theme list was not JSON: %s" % e)
          want = os.environ["THEME_ID"]
          print(next((t.get("role", "") for t in themes if str(t.get("id")) == want), "missing"))
          PY
          )
          echo "target theme $THEME_ID has role: $role"
          case "$role" in
            live|main)
              echo "::error::Refusing to deploy to the published theme. Re-run from the Actions tab with allow_live checked if that is genuinely intended."
              exit 1 ;;
            missing)
              echo "::error::Theme $THEME_ID not found on $SHOPIFY_FLAG_STORE."
              exit 1 ;;
          esac

      - name: Pull the current theme
        run: shopify theme pull --theme "$THEME_ID" --path build --force

      - name: Overlay the Nitidus files
        run: |
          set -euo pipefail
          cp -rv shopify/assets/.     build/assets/
          cp -rv shopify/sections/.   build/sections/
          cp -rv shopify/templates/.  build/templates/
          ./scripts/inject-theme-tags.sh build/layout/theme.liquid

      - name: Push
        run: shopify theme push --theme "$THEME_ID" --path build --allow-live=false

      - name: Summary
        run: |
          {
            echo "### Deployed to theme \`$THEME_ID\` on \`$SHOPIFY_FLAG_STORE\`"
            echo
            echo "Sections: $(ls shopify/sections | wc -l)  ·  Assets: $(ls shopify/assets | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
