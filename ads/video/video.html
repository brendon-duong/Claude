<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Inter Display","Inter",Arial,sans-serif;color:#fff;position:relative}
.layer{position:absolute;inset:0}
#hot{background:radial-gradient(900px 900px at 50% 38%,#ffb347 0%,#ff6a2b 35%,#c6341a 70%,#7a1a10 100%)}
#cold{background:radial-gradient(1100px 900px at 50% 60%,#1687c2 0%,#0a4a7c 45%,#06223f 100%)}
#flash{background:#fff}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;text-transform:uppercase;letter-spacing:-4px;line-height:.92;will-change:transform}
.stack{position:absolute;left:0;width:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
.stack .t{position:static;white-space:nowrap;width:auto}
#cap{top:820px;font-size:170px}
.ice{color:#9fe6ff}.warm{color:#fff1df}
#tub{position:absolute;left:540px;width:600px;height:520px;margin-left:-300px;margin-top:-260px;transform-origin:50% 50%}
#tub svg{overflow:visible;width:600px;height:520px}
.row{position:absolute;left:100px;width:960px;white-space:nowrap;font-weight:900;font-size:82px;letter-spacing:-3px;text-transform:uppercase;display:flex;gap:34px;align-items:center}
.row span{display:inline-flex;width:110px;height:110px;border-radius:55px;background:#fff;color:#06223f;align-items:center;justify-content:center;font-size:64px;letter-spacing:0;flex:none}
#timer{font-variant-numeric:tabular-nums;font-size:150px;letter-spacing:-2px;top:1130px}
#brand{position:absolute;left:50%;top:300px;transform:translateX(-50%);border:6px solid #fff;border-radius:16px;padding:16px 36px;font-weight:800;font-size:44px;letter-spacing:8px;white-space:nowrap}
#btn{position:absolute;left:50%;top:1400px;background:#fff;color:#06223f;font-weight:900;font-size:68px;padding:38px 110px;border-radius:120px;text-transform:uppercase;letter-spacing:2px;white-space:nowrap}
#ship{top:1590px;font-size:42px;font-weight:600;letter-spacing:0;text-transform:none;line-height:1.3;color:#d9f1fb}
</style></head><body>
<div class="layer" id="cold"></div><img class="layer" id="clip" style="width:1080px;height:1920px;object-fit:cover;display:none"><div class="layer" id="shade" style="background:linear-gradient(180deg,rgba(3,18,34,1) 0%,rgba(3,18,34,.75) 45%,rgba(3,18,34,.9) 100%);opacity:0"></div><div class="layer" id="hot"></div>
<div class="layer" id="shake"><div class="stack" style="top:330px;height:1000px">
 <div class="t" id="a1"></div><div class="t" id="a2"></div>
 <div class="t" id="a3" style="font-size:58px;letter-spacing:1px;font-weight:700;text-transform:none;margin-top:30px"></div>
</div></div>
<div class="stack" id="bst" style="top:260px;height:640px"><div class="t ice" id="b1"></div><div class="t ice" id="b2"></div></div>
<div class="t" id="c0" style="top:300px;font-size:88px;letter-spacing:-2px;line-height:1"></div>
<div class="row" id="c1" style="top:590px"><span>1</span><b id="r1"></b></div>
<div class="row" id="c2" style="top:750px"><span>2</span><b id="r2"></b></div>
<div class="row ice" id="c3" style="top:910px"><span>3</span><b id="r3"></b></div>
<div class="t" id="timer">0:00</div><div class="t ice" id="cap"></div>
<div class="t" id="d1" style="top:420px;font-size:210px"></div>
<div class="t ice" id="d2" style="top:660px;font-size:110px;letter-spacing:-2px"></div>
<div id="brand">YOUR BRAND</div>
<div class="t" id="e1" style="top:480px;font-size:104px;letter-spacing:-3px"></div>
<div id="tub"><svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#05080c"/><stop offset=".35" stop-color="#2a3138"/><stop offset=".6" stop-color="#14181d"/><stop offset="1" stop-color="#020304"/></linearGradient>
  <radialGradient id="water" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#d9f6ff"/><stop offset=".6" stop-color="#6fd0f2"/><stop offset="1" stop-color="#1f8fc4"/></radialGradient>
  <linearGradient id="icg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#bfeaff"/></linearGradient>
 </defs>
 <ellipse cx="300" cy="478" rx="250" ry="34" fill="#041628" opacity=".55"/>
 <path d="M80 120 V430 A220 62 0 0 0 520 430 V120 Z" fill="url(#body)"/>
 <g fill="none" stroke="#3b444d" stroke-width="3" opacity=".8"><path d="M80 215 A220 62 0 0 0 520 215"/><path d="M80 320 A220 62 0 0 0 520 320"/></g>
 <g stroke="#11151a" stroke-width="5" opacity=".9"><line x1="170" y1="172" x2="170" y2="482"/><line x1="300" y1="182" x2="300" y2="492"/><line x1="430" y1="172" x2="430" y2="482"/></g>
 <ellipse cx="300" cy="120" rx="220" ry="62" fill="#0c1014"/>
 <ellipse cx="300" cy="120" rx="220" ry="62" fill="none" stroke="#4a545e" stroke-width="5"/>
 <ellipse cx="300" cy="128" rx="198" ry="52" fill="url(#water)"/>
 <ellipse id="rip" cx="300" cy="128" rx="60" ry="16" fill="none" stroke="#fff" stroke-width="4"/>
 <g id="rest" fill="url(#icg)" stroke="#fff" stroke-width="2"></g>
 <g id="fall" fill="url(#icg)" stroke="#fff" stroke-width="2"></g>
 <rect x="500" y="388" width="34" height="20" rx="5" fill="#222a31"/><circle cx="538" cy="398" r="8" fill="#e2562a"/>
</svg></div>
<div id="btn">Shop now</div>
<div class="t" id="ship">Ships Australia-wide</div>
<div class="layer" id="flash"></div>
<script>
const $=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const p=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),ei=x=>x*x*x,back=x=>{const c=1.7;return 1+ (c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;

const ST=['Hesitation','Instant regret','Totally hooked'],CAP=[[5.3,'Why.'],[6.6,"Breathe."],[7.9,"Okay…"],[9.2,"Done."]];
const HOT='radial-gradient(900px 900px at 50% 38%,#ffb347 0%,#ff6a2b 35%,#c6341a 70%,#7a1a10 100%)';
const V={
 nolast:{bg:'radial-gradient(900px 900px at 50% 38%,#5ad1ff 0%,#1b6fd6 45%,#0a1f5c 100%)',fg:'#fff',sub:'#dff3ff',a1:'Nobody lasts',a2:'their first go.',a3:"That's the point.",b1:'Get',b2:'in.',mid:'timer',end:180,e:['Three minutes.','Your place.']},
 shower:{bg:'radial-gradient(900px 900px at 50% 38%,#ffe29a 0%,#ff9f43 45%,#b3541e 100%)',fg:'#2a1300',sub:'#4a2400',a1:'Cold showers',a2:"aren't cold.",a3:'Not in an Aussie summer.',b1:'This',b2:'is cold.',mid:'list',title:['The 3 stages of','a cold plunge'],rows:ST,e:['Actually cold.','At your place.']},
 runner:{bg:'radial-gradient(900px 900px at 50% 38%,#ff7a59 0%,#d63a3a 45%,#3d0a14 100%)',fg:'#fff',sub:'#ffd9d0',a1:'Long run:',a2:'Done.',a3:'Legs: cooked.',b1:'Now',b2:'get in.',mid:'timer',end:180,e:['Finish every','run cold.']},
 nomember:{bg:'radial-gradient(900px 900px at 50% 38%,#b06cff 0%,#6a2bd9 45%,#1c0a4a 100%)',fg:'#fff',sub:'#e8dcff',a1:'No membership.',a2:'No booking.',a3:'No driving across town.',b1:'Just',b2:'get in.',mid:'list',title:['Ready in','3 steps'],rows:['Set it up','Fill it','Add ice'],notimer:1,e:['Your ice bath.','Your schedule.']},
 balcony:{bg:'radial-gradient(900px 900px at 50% 38%,#7ef0d0 0%,#12a594 45%,#063f3a 100%)',fg:'#04211e',sub:'#04211e',a1:'Got a',a2:'balcony?',a3:"Then you've got room.",b1:'Ice bath.',b2:'Sorted.',mid:'list',title:['Ready in','3 steps'],rows:['Set it up','Fill it','Add ice'],notimer:1,e:['Small space.','Big chill.']},
 hardest:{bg:'radial-gradient(900px 900px at 50% 38%,#3a3f4a 0%,#1c1f26 50%,#050608 100%)',fg:'#fff',sub:'#c9d2e0',a1:'The hardest',a2:'3 minutes',a3:'of your day.',b1:'Also',b2:'the best.',mid:'timer',end:180,e:['Three minutes.','Every day.']},
 scroll:{bg:'radial-gradient(900px 900px at 50% 38%,#ff4d6d 0%,#c9184a 45%,#4a0519 100%)',fg:'#fff',sub:'#ffd6df',a1:'Stop',a2:'scrolling.',a3:'Start shivering.',b1:'Get',b2:'in.',mid:'timer',end:120,e:['Get yours.','Start the clock.']},
 coming:{bg:'linear-gradient(180deg,#ffcf5c 0%,#ff8a3d 50%,#d1432a 100%)',fg:'#2a0d00',sub:'#4a1a05',a1:'Summer',a2:'is coming.',a3:'So is the heat.',b1:'Cool off',b2:'properly.',mid:'list',title:['The 3 stages of','a cold plunge'],rows:ST,e:['Your backyard.','Your ice bath.']},
 summer:{bg:HOT,fg:'#fff1df',sub:'#3b0d06',a1:[26,35,'°'],a2:'Outside.',a3:"And the aircon's losing.",b1:[35,4,'°'],b2:'In here.',mid:'list',title:['The 3 stages of','a cold plunge'],rows:ST,e:['Your backyard.','Your ice bath.']},
 summer_timer:{bg:HOT,fg:'#fff1df',sub:'#3b0d06',a1:[26,35,'°'],a2:'Outside.',a3:"And the aircon's losing.",b1:[35,4,'°'],b2:'In here.',mid:'timer',end:180,e:['The coldest spot','in your house.']},
 studio:{bg:'radial-gradient(900px 900px at 50% 38%,#ff5fa2 0%,#c2188b 40%,#5b0f7a 100%)',fg:'#fff',sub:'#ffe1f1',a1:'Still paying',a2:'per plunge?',a3:'Every. Single. Session.',b1:'Plunge',b2:'at home.',mid:'list',title:['Ready in','3 steps'],rows:['Set it up','Fill it','Add ice'],notimer:1,e:['Pay once.','Plunge daily.']},
 legday:{bg:'radial-gradient(900px 900px at 50% 38%,#e03131 0%,#7d1515 45%,#1a0606 100%)',fg:'#fff',sub:'#ffd0d0',a1:'Leg day:',a2:'Done.',a3:'Now the hard part.',b1:'3 min.',b2:'At 4°.',mid:'timer',end:180,e:['Finish every','session cold.']},
 dare:{bg:'radial-gradient(900px 900px at 50% 38%,#fff06a 0%,#ffd400 45%,#f0a500 100%)',fg:'#111',sub:'#3a2a00',a1:'Bet you',a2:"can't last",a3:'2 minutes in ice water.',b1:'Prove',b2:'it.',mid:'timer',end:120,e:['Get yours.','Start the clock.']},
 morning:{bg:'linear-gradient(180deg,#2b1055 0%,#7a3b8f 45%,#ff7e5f 100%)',fg:'#fff',sub:'#ffe3d6',a1:'5:45',a2:'AM.',a3:'Coffee can wait.',b1:'Wake up',b2:'properly.',mid:'list',title:['The 3 stages of','a cold plunge'],rows:ST,e:['Earn your','morning.']},
 mate:{bg:'radial-gradient(900px 900px at 50% 38%,#4be38a 0%,#0f9d58 45%,#064a2a 100%)',fg:'#fff',sub:'#062b18',a1:'Tag the mate',a2:"who'd last",a3:'10 seconds.',b1:'Then',b2:'beat them.',mid:'timer',end:120,e:['Ice bath.','Your place.']},
 comfort:{bg:'radial-gradient(900px 900px at 50% 38%,#f4f1ea 0%,#d9d3c7 50%,#a59d8d 100%)',fg:'#111',sub:'#3a372f',a1:'Comfort',a2:'is easy.',a3:'Anyone can do easy.',b1:'Do',b2:'this.',mid:'list',title:['The 3 stages of','a cold plunge'],rows:ST,e:['Three minutes.','Every day.']}};
const Q=new URLSearchParams(location.search),NCLIP=+Q.get('clip')||0;
const C=V[new URLSearchParams(location.search).get('v')||'summer'];
function fit(el,txt,max){el.textContent=txt;let s=max;el.style.fontSize=s+'px';while(el.scrollWidth>980&&s>40){s-=6;el.style.fontSize=s+'px'}}
const cnt=x=>Array.isArray(x);
$('hot').style.background=C.bg;['a1','a2'].forEach(i=>$(i).style.color=C.fg);$('a3').style.color=C.sub;$('a3').textContent=C.a3;
fit($('a1'),cnt(C.a1)?'35°':C.a1,cnt(C.a1)?470:230);fit($('a2'),C.a2,cnt(C.a1)?170:230);
fit($('b1'),cnt(C.b1)?'35°':C.b1,cnt(C.b1)?400:250);fit($('b2'),C.b2,cnt(C.b1)?170:250);
if(C.mid=='list'){$('c0').innerHTML=C.title[0]+'<br><span class="ice">'+C.title[1]+'</span>';C.rows.forEach((r,i)=>$('r'+(i+1)).textContent=r)}
else{$('timer').style.top='420px';$('timer').style.fontSize='330px'}
$('e1').innerHTML=C.e[0]+'<br><span class="ice">'+C.e[1]+'</span>';
if(NCLIP){$('d1').style.top='1060px';$('d2').style.top='1300px';$('d2').style.color='#fff';$('bst').style.top='1070px';$('bst').style.height='540px';$('bst').style.gap='10px';$('bst').style.textShadow='0 6px 30px rgba(0,0,0,.7)';['b1','b2'].forEach(i=>{$(i).style.color='#fff'});fit($('b1'),cnt(C.b1)?'35°':C.b1,cnt(C.b1)?300:210);fit($('b2'),C.b2,cnt(C.b1)?170:210)}
// ice cubes
const N=16,cubes=[];const NS='http://www.w3.org/2000/svg';
for(let i=0;i<N;i++){const x=120+((i*137)%360),y=96+((i*53)%60),s=34+((i*29)%20),r=((i*47)%50)-25;
 const mk=g=>{const e=document.createElementNS(NS,'rect');e.setAttribute('width',s);e.setAttribute('height',s*.86);e.setAttribute('rx',8);g.appendChild(e);return e};
 cubes.push({x,y,s,r,f:mk($('fall')),k:mk($('rest')),t0:2.62+i*0.12});}
function show(el,o,tr){el.style.opacity=o;if(tr!==undefined)el.style.transform=tr}
function pop(el,t,a,dur=.35,out=null,extra=''){ // pop in at a, optional fade at out
 let o=p(t,a,a+.12),s=lerp(.7,1,back(p(t,a,a+dur)));if(out!==null){o*=1-p(t,out,out+.18)}
 show(el,o,`${extra} scale(${s})`)}
window.seek=function(t){
 const cut=2.5;
 // backgrounds
 $('hot').style.opacity=t<cut?1:0;$('hot').style.transform=`scale(${1.05+.06*Math.sin(t*5)})`;
 $('cold').style.opacity=t>=cut?1:0;
 $('flash').style.opacity=t>=cut?.9*(1-p(t,cut,cut+.3)):0;
 if(NCLIP){const im=$('clip');im.style.display=t>=cut?'block':'none';let k;
  if(t<5)k=(t-cut)*30;else if(t<12.5){const span=NCLIP-76,x=((t-5)*15)%(2*span);k=75+(x<span?x:2*span-x)}else k=NCLIP-1;
  k=Math.max(0,Math.min(NCLIP-1,Math.round(k)));const src='clip/c'+String(k+1).padStart(4,'0')+'.jpg';if(im.dataset.s!==src){im.dataset.s=src;im.src=src}
  $('shade').style.opacity=t<cut?0:t<5?.15:t<10?.72:t<12.5?.6:.86;}
 // S1
 const s1=t<cut?1:0;$('shake').style.opacity=s1;
 const amp=4+10*p(t,.8,2.5);$('shake').style.transform=`translate(${Math.sin(t*61)*amp}px,${Math.cos(t*47)*amp}px)`;
 if(cnt(C.a1))$('a1').textContent=Math.round(lerp(C.a1[0],C.a1[1],eo(p(t,0,1.1))))+C.a1[2];
 show($('a1'),1,`scale(${lerp(1.5,1,eo(p(t,0,.35)))+.05*p(t,1.1,2.5)})`);
 pop($('a2'),t,.55);show($('a3'),p(t,1.35,1.55),`translateY(${lerp(30,0,eo(p(t,1.35,1.7)))}px)`);
 // S2 text
 const b=t>=cut&&t<5.1;const bo=b?(1-p(t,4.85,5.05)):0;
 if(cnt(C.b1))$('b1').textContent=Math.round(lerp(C.b1[0],C.b1[1],eo(p(t,cut,3.5))))+C.b1[2];
 show($('b1'),bo,`scale(${lerp(1.6,1,eo(p(t,cut,cut+.3)))})`);
 show($('b2'),bo*p(t,3.0,3.1),`scale(${lerp(.7,1,back(p(t,3.0,3.35)))})`);
 // tub position
 const keys=[[2.5,2300,1.25],[3.0,1330,1.3],[4.9,1330,1.3],[5.3,1560,.82],[9.8,1560,.82],[10.15,1290,1.25],[12.3,1290,1.25],[12.7,1060,.86],[15,1060,.9]];
 let y=keys[0][1],sc=keys[0][2];for(let i=0;i<keys.length-1;i++){const[a,ya,sa]=keys[i],[bb,yb,sb]=keys[i+1];if(t>=a){const x=eo(p(t,a,bb));y=lerp(ya,yb,x);sc=lerp(sa,sb,x)}}
 const bob=t>3?Math.sin(t*2.2)*6:0;
 show($('tub'),t>=cut&&!NCLIP?1:0,`translateY(${y+bob}px) scale(${sc})`);$('tub').style.top='0px';
 // cubes
 cubes.forEach(c=>{const x=p(t,c.t0,c.t0+.5),land=x>=1;
  c.f.setAttribute('transform',`translate(${c.x},${lerp(-1100,c.y,ei(x))}) rotate(${c.r+ (1-x)*240} ${c.s/2} ${c.s/2})`);c.f.setAttribute('opacity',t>=c.t0&&!land?1:0);
  const wob=Math.sin(t*2+c.x)*3;c.k.setAttribute('transform',`translate(${c.x},${c.y+wob}) rotate(${c.r+wob*2} ${c.s/2} ${c.s/2})`);c.k.setAttribute('opacity',land?.95:0);});
 const rp=(t*1.4)%1;$('rip').setAttribute('rx',60+130*rp);$('rip').setAttribute('ry',16+34*rp);$('rip').setAttribute('opacity',t>3?(1-rp)*.7:0);
 // S3
 const c=t>=5.05&&t<10.05,co=c?1-p(t,9.8,10):0;
 const L=C.mid=='list',END=C.end||180;
 show($('c0'),L?co*p(t,5.05,5.2):0,`translateY(${lerp(-40,0,eo(p(t,5.05,5.4)))}px)`);
 [['c1',5.6],['c2',7.0],['c3',8.4]].forEach(([id,a])=>{show($(id),L?co*p(t,a,a+.1):0,`translateX(${lerp(-120,0,back(p(t,a,a+.4)))}px)`)});
 const sec=Math.round(END*p(t,5.3,9.2));$('timer').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
 $('timer').style.color=sec>=END?'#9fe6ff':'#fff';show($('timer'),C.notimer?0:co*p(t,5.2,5.4),`scale(${sec>=END?lerp(1.25,1,eo(p(t,9.2,9.5))):1})`);
 let cp=null;CAP.forEach(x=>{if(t>=x[0])cp=x});if(!L&&cp){$('cap').textContent=cp[1];show($('cap'),co,`scale(${lerp(1.4,1,eo(p(t,cp[0],cp[0]+.2)))})`)}else show($('cap'),0);
 // S4
 const feats=[[10.05,'5 MIN','set-up'],[10.85,'NO','plumbing'],[11.65,'PACKS','away flat']];let f=null;feats.forEach(x=>{if(t>=x[0])f=x});
 if(f&&t<12.45){$('d1').textContent=f[1];$('d2').textContent=f[2];const s=lerp(1.5,1,eo(p(t,f[0],f[0]+.2)));show($('d1'),1,`scale(${s})`);show($('d2'),p(t,f[0]+.1,f[0]+.2),'')}else{show($('d1'),0);show($('d2'),0)}
 // S5
 const e=t>=12.5;show($('brand'),e?p(t,12.5,12.7):0);
 show($('e1'),e?p(t,12.6,12.75):0,`scale(${lerp(.8,1,back(p(t,12.6,13)))})`);
 const pulse=1+.04*Math.sin((t-13)*7);show($('btn'),e?p(t,13.2,13.35):0,`translateX(-50%) scale(${lerp(.6,1,back(p(t,13.2,13.6)))*pulse})`);
 show($('ship'),e?p(t,13.6,13.8):0,'');
};
seek(0);
</script></body></html>
